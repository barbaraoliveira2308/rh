    <rect x="578" y="548" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="644" y="570" text-anchor="middle">Timesheets</text>
    <rect x="724" y="548" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="790" y="570" text-anchor="middle">Absences</text>
    <rect x="870" y="548" width="62" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="901" y="570" text-anchor="middle">RH</text>
    <rect x="140" y="602" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="206" y="624" text-anchor="middle">Expenses</text>
    <rect x="286" y="602" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="352" y="624" text-anchor="middle">Calendar</text>
    <rect x="432" y="602" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="498" y="624" text-anchor="middle">Policies</text>
    <rect x="578" y="602" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="644" y="624" text-anchor="middle">Helpdesk</text>
    <rect x="724" y="602" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="790" y="624" text-anchor="middle">Reports</text>
    <rect x="870" y="602" width="62" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="901" y="624" text-anchor="middle">GDPR</text>
    <rect x="140" y="656" width="132" height="20" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="206" y="670" text-anchor="middle">Training</text>
    <rect x="286" y="656" width="132" height="20" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="352" y="670" text-anchor="middle">Workflow</text>
    <rect x="432" y="656" width="132" height="20" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="498" y="670" text-anchor="middle">Notifications</text>
    <rect x="578" y="656" width="132" height="20" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="644" y="670" text-anchor="middle">Analytics</text>
    <rect x="724" y="656" width="132" height="20" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="790" y="670" text-anchor="middle">Admin</text>
    <rect x="870" y="656" width="62" height="20" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="901" y="670" text-anchor="middle">Audit</text>
  </g>

  <rect x="1060" y="500" width="424" height="184" rx="10" fill="#fffdf9" stroke="#dfd7ca"/>
  <text x="1084" y="529" class="label">Serviços transversais</text>
  <rect x="1084" y="550" width="174" height="40" rx="8" fill="#eee8de" stroke="#d8cdbc"/><text x="1171" y="575" text-anchor="middle" class="label">JWT + RBAC</text>
  <rect x="1274" y="550" width="174" height="40" rx="8" fill="#eee8de" stroke="#d8cdbc"/><text x="1361" y="575" text-anchor="middle" class="label">Cache Redis</text>
  <rect x="1084" y="610" width="174" height="40" rx="8" fill="#eee8de" stroke="#d8cdbc"/><text x="1171" y="635" text-anchor="middle" class="label">Storage S3</text>
  <rect x="1274" y="610" width="174" height="40" rx="8" fill="#eee8de" stroke="#d8cdbc"/><text x="1361" y="635" text-anchor="middle" class="label">Eventos / Jobs</text>

  <path d="M340 716 L340 773" class="arrow"/>
  <path d="M620 716 L620 773" class="arrow"/>
  <path d="M900 716 L900 773" class="arrow"/>
  <path d="M1180 716 L1180 773" class="arrow"/>
  <path d="M1380 716 L1380 773" class="arrow"/>

  <text x="88" y="808" class="layer">INFRAESTRUTURA DOCKER</text>
  <rect x="88" y="829" width="1424" height="82" rx="12" fill="#edf0f1" stroke="#cbd2d4"/>
  <rect x="116" y="850" width="252" height="42" rx="8" fill="#ffffff" stroke="#c7ced0"/>
  <text x="242" y="876" text-anchor="middle" class="label">PostgreSQL 16</text>
  <rect x="395" y="850" width="252" height="42" rx="8" fill="#ffffff" stroke="#c7ced0"/>
  <text x="521" y="876" text-anchor="middle" class="label">Redis 7</text>
  <rect x="674" y="850" width="252" height="42" rx="8" fill="#ffffff" stroke="#c7ced0"/>
  <text x="800" y="876" text-anchor="middle" class="label">RabbitMQ</text>
  <rect x="953" y="850" width="252" height="42" rx="8" fill="#ffffff" stroke="#c7ced0"/>
  <text x="1079" y="876" text-anchor="middle" class="label">RustFS / S3</text>
  <rect x="1232" y="850" width="252" height="42" rx="8" fill="#ffffff" stroke="#c7ced0"/>
  <text x="1358" y="876" text-anchor="middle" class="label">Mailpit / SMTP</text>

  <path d="M1360 684 C1360 740 1079 790 1079 850" class="arrow dashed"/>
</svg>
