<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura atual do HR Suite</title>
  <desc id="desc">Diagrama das camadas frontend, backend NestJS, módulos de negócio, serviços transversais e infraestrutura.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f2933" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#69757a"/>
    </marker>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #263238; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: #667277; }
      .layer { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #4b5558; letter-spacing: 1.6px; }
      .group { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #263238; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #263238; }
      .small { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #667277; }
      .box { stroke: #c7ced0; stroke-width: 1.5; rx: 10; }
      .arrow { stroke: #69757a; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f4f6f6"/>
  <rect x="48" y="34" width="1504" height="912" rx="18" fill="#ffffff" stroke="#d6dcde" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="88" y="92" class="title">HR Suite · Arquitetura atual</text>
  <text x="88" y="122" class="subtitle">Monorepo pnpm · React/Vite · NestJS/TypeORM · PostgreSQL · serviços Docker</text>

  <text x="88" y="174" class="layer">EXPERIÊNCIA</text>
  <rect x="88" y="195" width="1424" height="116" rx="12" fill="#eef3f3" stroke="#c8d4d5"/>
  <rect x="116" y="220" width="250" height="66" class="box" fill="#ffffff"/>
  <text x="241" y="248" text-anchor="middle" class="group">React 18 + Vite</text>
  <text x="241" y="271" text-anchor="middle" class="small">SPA · Tailwind · MUI</text>
  <rect x="406" y="220" width="250" height="66" class="box" fill="#ffffff"/>
  <text x="531" y="248" text-anchor="middle" class="group">React Router</text>
  <text x="531" y="271" text-anchor="middle" class="small">rotas e lazy loading</text>
  <rect x="696" y="220" width="250" height="66" class="box" fill="#ffffff"/>
  <text x="821" y="248" text-anchor="middle" class="group">TanStack Query</text>
  <text x="821" y="271" text-anchor="middle" class="small">cache e mutations API</text>
  <rect x="986" y="220" width="250" height="66" class="box" fill="#ffffff"/>
  <text x="1111" y="248" text-anchor="middle" class="group">Zustand + Axios</text>
  <text x="1111" y="271" text-anchor="middle" class="small">sessão e cliente HTTP</text>
  <rect x="1276" y="220" width="208" height="66" class="box" fill="#ffffff"/>
  <text x="1380" y="248" text-anchor="middle" class="group">Playwright</text>
  <text x="1380" y="271" text-anchor="middle" class="small">testes E2E</text>

  <path d="M800 311 L800 360" class="arrow"/>
  <text x="818" y="342" class="small">HTTP /api · JWT Bearer</text>

  <text x="88" y="395" class="layer">APLICAÇÃO</text>
  <rect x="88" y="416" width="1424" height="300" rx="12" fill="#f5f2ed" stroke="#ded4c5"/>
  <text x="116" y="449" class="group">Backend NestJS</text>
  <text x="116" y="474" class="small">Controllers · Guards · Services · TypeORM · EventEmitter2 · Swagger dev/staging</text>

  <rect x="116" y="500" width="920" height="184" rx="10" fill="#fffdf9" stroke="#dfd7ca"/>
  <text x="140" y="529" class="label">Módulos de negócio</text>
  <g class="small">
    <rect x="140" y="548" width="132" height="34" rx="7" fill="#edf3f3" stroke="#c8d4d5"/><text x="206" y="570" text-anchor="middle">Auth · RBAC</text>
