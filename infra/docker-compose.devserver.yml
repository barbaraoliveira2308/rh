# Servidor de desenvolvimento partilhado, gerido por um stack Git do Portainer que segue o branch
# `develop` (ver DEPLOY_PORTAINER.md). Baseado em docker-compose.prod.yml, com estas diferenças:
# - nomes `srh-*-devserver`, para não colidir com um stack de produção no mesmo host;
# - só o frontend (8888) e a UI do Mailpit (8025) são publicados no host;
# - o Mailpit captura todos os emails (nada é enviado para fora);
# - o backend corre também o seed de dados de demo a cada arranque;
# - o backend e o frontend são imagens locais (`srh-local/…:develop`) construídas pelo CI no Docker
#   deste mesmo host (P-106; sem registry — ver R-072); o Portainer já não constrói imagens;
# - o serviço one-shot `prune` limpa imagens antigas e a cache de build antiga no fim de cada deploy.
# Sem bind mounts de ficheiros do repositório: o Portainer corre o stack a partir do seu próprio
# clone. A única exceção é o socket do Docker do host (caminho absoluto), usado pelo `prune`.
name: srh-devserver

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: srh-postgres-devserver
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine
    container_name: srh-redis-devserver
    restart: unless-stopped
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Armazenamento S3 (RustFS, Apache-2.0), versão fixada — ver DEPLOY_PORTAINER.md.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: srh-rustfs-devserver
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  # Serviço one-shot: cria o bucket de documentos e termina. Sem isto, os uploads
  # falham com NoSuchBucket — nem o compose nem o StorageService criam o bucket.
  # AWS CLI (cliente S3 genérico): não tem `mb --ignore-existing`, daí o `head-bucket` antes.
  createbuckets:
    image: public.ecr.aws/aws-cli/aws-cli:2.37.4
    container_name: srh-createbuckets-devserver
    restart: 'no'
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-eu-west-1}
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: >
      /bin/sh -c "
      until aws s3api list-buckets >/dev/null 2>&1; do
        echo 'à espera do RustFS...'; sleep 2;
      done;
      aws s3api head-bucket --bucket '${STORAGE_BUCKET:-srh-documents}' 2>/dev/null ||
      aws s3 mb 's3://${STORAGE_BUCKET:-srh-documents}'
      "

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: srh-rabbitmq-devserver
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: srh-mailpit-devserver
    restart: unless-stopped
    ports:
      - '8025:8025'

  backend:
    # Construída pelo job build-images do CI no Docker deste host; nunca é descarregada.
    image: srh-local/backend:develop
    pull_policy: never
    container_name: srh-backend-devserver
    restart: unless-stopped
    expose:
      - '3000'
    # Mesma sequência do CMD do backend/Dockerfile, mais o seed de dados de demo antes de
    # arrancar o servidor. Os seeds de demo verificam o que já existe, por isso correr a cada
    # arranque não duplica dados — mas registos de demo apagados voltam a ser criados.
    command:
      - sh
      - -c
      - >-
        pnpm --filter @bridge351/srh-backend run schema:create &&
        pnpm --filter @bridge351/srh-backend run migration:run:prod &&
        pnpm --filter @bridge351/srh-backend run seed:prod &&
        node backend/dist/database/seeds/demo-runner.js &&
        node backend/dist/main
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_USE_SSL: 'true'
      JWT_ACCESS_PRIVATE_KEY: ${JWT_ACCESS_PRIVATE_KEY}
      JWT_ACCESS_PUBLIC_KEY: ${JWT_ACCESS_PUBLIC_KEY}
      JWT_REFRESH_PRIVATE_KEY: ${JWT_REFRESH_PRIVATE_KEY}
      JWT_REFRESH_PUBLIC_KEY: ${JWT_REFRESH_PUBLIC_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      BACKEND_PORT: 3000
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      # Todos os emails vão para o Mailpit (UI em :8025), nunca para fora.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ''
      SMTP_PASS: ''
      SMTP_FROM: ${SMTP_FROM}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    # Construída com VITE_API_URL=/api pelo job build-images do CI no Docker deste host.
    image: srh-local/frontend:develop
    pull_policy: never
    container_name: srh-frontend-devserver
    restart: unless-stopped
    ports:
      - '8888:80'
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    depends_on:
      - backend

  # Serviço one-shot: corre no fim de cada deploy, depois de o backend e o frontend terem sido
  # recriados (as imagens antigas já não estão em uso), e termina.
  # - `image prune`: versões anteriores das imagens do CI (label srh.ci-image), sem tag e já sem
  #   contentores. O job build-images faz o mesmo; isto é uma rede de segurança.
  # - `builder prune --filter until=168h`: só a cache de build sem uso há mais de 7 dias. A cache
  #   recente fica: é ela que torna rápidos os builds do CI no mesmo host (P-106).
  # ⚠️ O socket do Docker dá a este contentor controlo total do Docker do host (equivale a root).
  prune:
    image: docker:29.8.1-cli
    container_name: srh-prune-devserver
    restart: 'no'
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        docker image prune -f --filter label=srh.ci-image=true
        docker builder prune -f --filter until=168h

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  rabbitmq-data:
