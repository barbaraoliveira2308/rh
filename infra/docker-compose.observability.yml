# Métricas do CI (P-104): base de dados com o histórico de cada pipeline do `develop` e Grafana
# com os dashboards. Stack Git do Portainer no host do servidor de dev — ver DEPLOY_PORTAINER.md,
# secção "8. Métricas do CI (Grafana)".
# - metrics-db: publicada na porta 5433 do host, para o job collect-metrics do CI lá chegar
#   (os jobs correm noutra rede Docker). Protegida só pelas passwords.
# - grafana: porta 3300, leitura anónima (sem login); a conta admin só serve para administração.
# Sem retenção: o histórico é mantido por inteiro.
name: srh-observability

services:
  metrics-db:
    build:
      context: observability/metrics-db
    pull_policy: build
    container_name: srh-metrics-db
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: srh_metrics
      POSTGRES_USER: metrics_admin
      POSTGRES_PASSWORD: ${METRICS_DB_ADMIN_PASSWORD}
      METRICS_WRITER_PASSWORD: ${METRICS_WRITER_PASSWORD}
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD}
    volumes:
      - metrics-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U metrics_admin -d srh_metrics']
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    build:
      context: observability/grafana
    pull_policy: build
    container_name: srh-grafana
    restart: unless-stopped
    ports:
      - '3300:3000'
    environment:
      METRICS_READER_PASSWORD: ${METRICS_READER_PASSWORD}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/security.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    depends_on:
      metrics-db:
        condition: service_healthy

volumes:
  metrics-db-data:
  grafana-data:
