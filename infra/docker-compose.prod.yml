name: srh-prod

services:
  postgres:
    image: postgres:16.15-alpine
    container_name: srh-postgres-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.11-alpine
    container_name: srh-redis-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Armazenamento S3 (RustFS, Apache-2.0), versão fixada — ver DEPLOY_PORTAINER.md.
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: srh-rustfs-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:9000:9000'
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  # Serviço one-shot: cria o bucket de documentos e termina. Sem isto, os uploads
  # falham com NoSuchBucket — nem o compose nem o StorageService criam o bucket.
  # AWS CLI (cliente S3 genérico): não tem `mb --ignore-existing`, daí o `head-bucket` antes.
  createbuckets:
    image: public.ecr.aws/aws-cli/aws-cli:2.37.4
    container_name: srh-createbuckets-prod
    restart: 'no'
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-eu-west-1}
      AWS_ENDPOINT_URL: http://rustfs:9000
    entrypoint: >
      /bin/sh -c "
      until aws s3api list-buckets >/dev/null 2>&1; do
        echo 'à espera do RustFS...'; sleep 2;
      done;
      aws s3api head-bucket --bucket '${STORAGE_BUCKET:-srh-documents}' 2>/dev/null ||
      aws s3 mb 's3://${STORAGE_BUCKET:-srh-documents}'
      "

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    container_name: srh-rabbitmq-prod
    restart: unless-stopped
    ports:
      - '127.0.0.1:5672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: srh-backend-prod
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_USE_SSL: 'true'
      JWT_ACCESS_PRIVATE_KEY: ${JWT_ACCESS_PRIVATE_KEY}
      JWT_ACCESS_PUBLIC_KEY: ${JWT_ACCESS_PUBLIC_KEY}
      JWT_REFRESH_PRIVATE_KEY: ${JWT_REFRESH_PRIVATE_KEY}
      JWT_REFRESH_PUBLIC_KEY: ${JWT_REFRESH_PUBLIC_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      BACKEND_PORT: 3000
      BACKEND_CORS_ORIGIN: ${BACKEND_CORS_ORIGIN}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: srh-frontend-prod
    restart: unless-stopped
    ports:
      - '80:80'
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  rabbitmq-data:
