version: 2
updates:
  # pnpm monorepo workspace (backend/, frontend/, shared/) — a single root
  # entry is sufficient; Dependabot resolves all workspace package.json
  # files against the shared pnpm-lock.yaml.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      dependencies:
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'

  # Actions used by .github/workflows/ci.yml
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      actions:
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
      - 'ci'
